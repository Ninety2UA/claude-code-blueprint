<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#0f3460"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D4A574"/>
      <stop offset="100%" style="stop-color:#E8D5C4"/>
    </linearGradient>
    <linearGradient id="purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- Blueprint grid -->
  <g opacity="0.07" stroke="#D4A574" stroke-width="0.8">
    <line x1="64" y1="64" x2="64" y2="448"/>
    <line x1="128" y1="64" x2="128" y2="448"/>
    <line x1="192" y1="64" x2="192" y2="448"/>
    <line x1="256" y1="64" x2="256" y2="448"/>
    <line x1="320" y1="64" x2="320" y2="448"/>
    <line x1="384" y1="64" x2="384" y2="448"/>
    <line x1="448" y1="64" x2="448" y2="448"/>
    <line x1="64" y1="64" x2="448" y2="64"/>
    <line x1="64" y1="128" x2="448" y2="128"/>
    <line x1="64" y1="192" x2="448" y2="192"/>
    <line x1="64" y1="256" x2="448" y2="256"/>
    <line x1="64" y1="320" x2="448" y2="320"/>
    <line x1="64" y1="384" x2="448" y2="384"/>
    <line x1="64" y1="448" x2="448" y2="448"/>
  </g>

  <!-- Stylized "B" using clean paths -->
  <g filter="url(#glow)">
    <!-- B shape — thick stroke, architectural feel -->
    <path d="
      M 152 104
      L 152 408
      L 296 408
      C 372 408, 372 288, 296 272
      L 280 272
      C 356 256, 356 104, 280 104
      Z
      M 192 144
      L 272 144
      C 316 144, 316 232, 272 232
      L 192 232
      Z
      M 192 272
      L 288 272
      C 340 272, 340 368, 288 368
      L 192 368
      Z
    " fill="url(#gold)" fill-rule="evenodd"/>
  </g>

  <!-- Plugin connector nodes (purple accents) -->
  <circle cx="376" cy="188" r="20" fill="url(#purple)" opacity="0.85"/>
  <circle cx="376" cy="188" r="9" fill="#fff" opacity="0.35"/>

  <circle cx="392" cy="340" r="20" fill="url(#purple)" opacity="0.85"/>
  <circle cx="392" cy="340" r="9" fill="#fff" opacity="0.35"/>

  <!-- Dashed connection lines -->
  <line x1="328" y1="188" x2="356" y2="188" stroke="#8b5cf6" stroke-width="2.5" opacity="0.5" stroke-dasharray="5,4"/>
  <line x1="348" y1="340" x2="372" y2="340" stroke="#8b5cf6" stroke-width="2.5" opacity="0.5" stroke-dasharray="5,4"/>
</svg>
